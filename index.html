<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Grade 7 Math Lab: an original interactive book with clear lessons, adaptive practice, and printable workbooks for ratios, percentages, counting, permutations, and combinations.">
  <meta name="theme-color" content="#133653">
  <title>Grade 7 Math Lab</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23133653'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='44' fill='white'%3E%25%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="counting-model.css">
  <link rel="stylesheet" href="book-layout.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to learning content</a>
  <header class="topbar">
    <a class="brand" href="#home">Grade 7 Math Lab</a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#learn" data-tab="learn">Learn</a>
      <a href="#practice" data-tab="practice">Practice</a>
    </nav>
  </header>
  <div class="shell">
    <aside class="book-sidebar" aria-label="Book navigation">
      <button class="contents-toggle" id="contents-toggle" type="button" aria-expanded="false" aria-controls="book-contents">Contents <span aria-hidden="true">▾</span></button>
      <nav id="book-contents" aria-label="Book contents"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <div id="storage-warning" class="notice" role="status" hidden>Your browser cannot save progress right now. You can still practice and export your results before leaving.</div>
      <section id="home-view" class="view"></section>
      <section id="chapter-view" class="view" hidden></section>
      <section id="learn-view" class="view" hidden></section>
      <section id="practice-view" class="view" hidden></section>
      <section id="print-view" class="view" hidden></section>
      <section id="progress-view" class="view" hidden></section>
      <section id="parents-view" class="view" hidden></section>
      <footer class="page-footer">
        <nav class="footer-links" aria-label="More options">
          <a href="#progress" data-tab="progress">Progress</a>
          <a href="#print" data-tab="print">Print</a>
          <a href="#parents" data-tab="parents">Parents</a>
          <button class="text-button parent-language" id="parent-language" type="button" aria-pressed="false" hidden>家长中文</button>
        </nav>
      </footer>
    </main>
  </div>
  <noscript><p class="notice">Enable JavaScript for the interactive book, or download the <a href="downloads/Grade-7-Math-Student-Workbook.pdf">student workbook</a> and <a href="downloads/Grade-7-Math-Answer-Guide.pdf">answer guide</a>.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
